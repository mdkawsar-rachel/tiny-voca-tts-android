name: Build Android TTS Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build tiny-voca TTS (native ggml)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download tiny-voca GGUF pair (checksum verified)
        run: python tools/download_models.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build native + Kotlin (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build native + Kotlin (Release)
        run: ./gradlew assembleRelease --stacktrace

      # GitHub Releases store assets outside the Actions artifact quota.
      - name: Publish release APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: tiny-voca TTS v1.0
          files: app/build/outputs/apk/release/*.apk
          overwrite_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
