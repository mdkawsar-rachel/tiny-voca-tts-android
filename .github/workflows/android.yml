name: Build Android TTS Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build tiny-voca TTS (native ggml)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository and llama.cpp submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download tiny-voca GGUF pair (checksum verified)
        run: python tools/download_models.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build native + Kotlin (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        continue-on-error: true  # artifact storage quota can be exhausted on free accounts
        with:
          name: tiny-voca-tts-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Build native + Kotlin (Release)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: tiny-voca-tts-release
          path: app/build/outputs/apk/release/*.apk
